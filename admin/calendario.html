<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Calendario — DE CERO A CIEN</title>
  <link rel="canonical" href="https://deceroacien.app/admin/calendario.html" />
  <!-- Estilos críticos primero para evitar FOUC -->
  <link rel="stylesheet" href="/assets/styles/tailwind.css" />
  <link rel="stylesheet" href="/assets/styles/common.css" />
  <link rel="stylesheet" href="/assets/styles/mobile.css" />
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <main class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold">Calendario (solo visualización)</h1>
    <p id="admin-alert" class="mt-2 text-red-400 hidden"></p>

    <section class="mt-6 p-4 rounded-lg bg-slate-800">
      <div id="activitiesTable"></div>
      <p class="text-sm text-gray-300 mt-3">Nota: La estructura de horario espera objetos { day, time, timezone, duration }.</p>
    </section>
  </main>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script>
    async function loadActivities(){
      const me = await AdminHelpers.requireAdminScopes(['calendar:read']);
      if (!me) return;
      const r = await AdminHelpers.apiFetch('/activities');
      const cols = [
        { key: 'name', label: 'Nombre' },
        { key: 'color', label: 'Color' },
        { key: 'recorded_course', label: 'Grabado?', render: (v)=> v? 'Sí':'No' },
        { key: 'schedule', label: 'Agenda', render: (v)=> '<pre class="text-xs whitespace-pre-wrap">'+(v? JSON.stringify(v,null,2):'')+'</pre>' }
      ];
      AdminHelpers.renderTable('activitiesTable', r.items||[], cols);
    }
    document.addEventListener('DOMContentLoaded', loadActivities);
  </script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/assets/js/components.js"></script>
</body>
</html>
