<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Panel SuperAdmin — DE CERO A CIEN</title>
  <link rel="canonical" href="https://deceroacien.app/admin/superadmin.html" />
  <!-- Estilos críticos primero para evitar FOUC -->
  <link rel="stylesheet" href="/assets/styles/tailwind.css" />
  <link rel="stylesheet" href="/assets/styles/common.css" />
  <link rel="stylesheet" href="/assets/styles/mobile.css" />
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <main class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold">Panel SuperAdmin</h1>
    <p id="admin-alert" class="mt-2 text-red-400 hidden"></p>

    <section class="mt-6 p-4 rounded-lg bg-slate-800">
      <p class="text-gray-300">Accesos rápidos:</p>
      <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        <a href="/admin/index.html" class="block p-4 rounded bg-slate-700/60 hover:bg-slate-700">Dashboard Admin</a>
        <a href="/admin/usuarios.html" class="block p-4 rounded bg-slate-700/60 hover:bg-slate-700">Usuarios</a>
        <a href="/admin/instituciones.html" class="block p-4 rounded bg-slate-700/60 hover:bg-slate-700">Instituciones</a>
        <a href="/admin/parametros.html" class="block p-4 rounded bg-slate-700/60 hover:bg-slate-700">Parámetros</a>
        <a href="/admin/cursos.html" class="block p-4 rounded bg-slate-700/60 hover:bg-slate-700">Cursos</a>
        <a href="/admin/calendario.html" class="block p-4 rounded bg-slate-700/60 hover:bg-slate-700">Calendario</a>
      </div>
    </section>
  </main>

  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Superadmin requiere '*'
      const me = await AdminHelpers.requireAdminScopes(['*']);
      if (!me) return;
    });
  </script>
  <script src="/assets/js/admin-layout.js"></script>
  <script src="/assets/js/components.js"></script>
</body>
</html>
